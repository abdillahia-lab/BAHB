# BAHB Optimized Multi-Modal Fusion Configuration
# Multi-Agent Deliberation Result: Hybrid Attention-Based Fusion
# Confidence: HIGH | Expected: +10-15% mAP, <1.5ms overhead

################################################################################
# Fusion Strategy Selection
################################################################################
multi_modal_fusion:
  strategy: "hybrid_attention"
  version: "2.0"

  # Deliberation Score: 7.55/10
  # Key advantages:
  # - Learned cross-modal correlation (attention mechanism)
  # - TensorRT-optimizable (<1ms with optimization)
  # - 60% already implemented in codebase
  # - Handles missing modalities gracefully

  ################################################################################
  # TensorRT Attention Configuration
  ################################################################################
  attention:
    enabled: true
    engine_path: "/home/user/BAHB/models/tensorrt/attention_fusion_fp16.engine"

    # Architecture
    embed_dim: 256               # Feature embedding dimension
    num_heads: 8                 # Multi-head attention heads
    dropout: 0.0                 # Disabled for inference
    precision: "fp16"            # FP16 for attention (no accuracy loss)

    # Feature extraction points
    visual_layer: "backbone.layer4"     # After visual backbone
    thermal_layer: "thermal.encoder"    # After thermal encoder

    # Cross-modal attention
    cross_modal:
      visual_to_thermal: true    # Visual queries, thermal keys/values
      thermal_to_visual: true    # Thermal queries, visual keys/values
      bidirectional_fusion: true # Fuse both attention outputs

    # Performance targets (from deliberation)
    latency_budget_ms: 1.5       # Total fusion overhead budget
    target_latency_ms: 0.8       # Optimized TensorRT target

  ################################################################################
  # Detection Matching (Late Fusion Component)
  ################################################################################
  matching:
    iou_threshold: 0.5           # Minimum IoU for detection matching
    algorithm: "hungarian"       # hungarian | greedy
    max_distance_px: 100         # Maximum spatial distance for matching

    # Vectorized IoU computation
    use_vectorized_iou: true     # NumPy vectorization for speed
    batch_matching: true         # Batch process detections

    # Match confidence requirements
    min_visual_confidence: 0.25
    min_thermal_confidence: 0.20

  ################################################################################
  # Modality Confidence Weights
  ################################################################################
  weights:
    visual: 0.50                 # Visual camera weight
    thermal: 0.35                # Thermal camera weight
    zoom: 0.15                   # Zoom camera weight (when available)
    attention_boost: 0.10        # Additional weight for attention-confirmed matches

    # Dynamic weighting based on conditions
    dynamic_weighting: true
    conditions:
      low_light:
        visual: 0.30
        thermal: 0.55
        zoom: 0.15
      high_contrast:
        visual: 0.60
        thermal: 0.25
        zoom: 0.15
      thermal_anomaly:
        visual: 0.35
        thermal: 0.50
        zoom: 0.15

  ################################################################################
  # Thermal Correlation Engine
  ################################################################################
  thermal:
    # Temperature thresholds (Celsius)
    baseline_ambient: 25.0       # Reference ambient temperature
    warning_threshold: 55.0      # Trigger warning severity
    critical_threshold: 75.0     # Trigger critical severity

    # Confidence boosting factors
    thermal_match_boost: 1.2     # +20% confidence for thermal correlation
    thermal_warning_boost: 1.25  # +25% for warning-level anomalies
    thermal_critical_boost: 1.3  # +30% for critical-level anomalies

    # Equipment-specific thermal zones (from domain knowledge)
    equipment_zones:
      transformer:
        class_id: 0
        normal: [20, 65]
        warning: [65, 85]
        critical: [85, 150]
        emissivity: 0.95

      insulator:
        class_id: 1
        normal: [15, 45]
        warning: [45, 65]
        critical: [65, 100]
        emissivity: 0.92

      conductor:
        class_id: 2
        normal: [15, 50]
        warning: [50, 75]
        critical: [75, 120]
        emissivity: 0.90

      switchgear:
        class_id: 3
        normal: [20, 55]
        warning: [55, 75]
        critical: [75, 110]
        emissivity: 0.94

      cable:
        class_id: 4
        normal: [20, 50]
        warning: [50, 70]
        critical: [70, 100]
        emissivity: 0.91

      hvac_unit:
        class_id: 5
        normal: [25, 45]
        warning: [45, 60]
        critical: [60, 85]
        emissivity: 0.93

      server_rack:
        class_id: 6
        normal: [25, 45]
        warning: [45, 60]
        critical: [60, 85]
        emissivity: 0.90

    # Temperature extraction
    extraction:
      method: "bbox_weighted"    # bbox_max, bbox_mean, bbox_weighted
      roi_scale: 0.8             # Scale factor for ROI within bbox
      min_pixels: 16             # Minimum pixels for valid temperature

  ################################################################################
  # Temporal Smoothing (Optional Kalman Filter)
  ################################################################################
  temporal:
    enabled: true
    process_noise: 0.01          # Low noise for static infrastructure
    measurement_noise: 0.1       # Trust YOLO26 detections
    max_tracking_age: 30         # Frames before track expiration
    min_detection_confidence: 0.3

    # Temporal consistency for severity
    severity_persistence_frames: 5  # Frames to maintain severity level
    hysteresis_enabled: true        # Prevent severity oscillation

  ################################################################################
  # Performance Optimization
  ################################################################################
  optimization:
    # CUDA optimization
    use_cuda_streams: true       # Async CUDA streams
    num_streams: 2               # Parallel processing streams

    # Memory optimization
    batch_thermal_extraction: true   # Batch temperature extraction
    preallocate_buffers: true        # Pre-allocate GPU memory
    use_zero_copy: true              # Zero-copy memory transfers

    # Computation optimization
    vectorized_iou: true         # NumPy vectorized IoU
    numpy_float32: true          # Use float32 for NumPy ops
    early_termination: true      # Skip fusion if no matches

  ################################################################################
  # Robustness & Fallback
  ################################################################################
  fallback:
    # Single modality handling
    visual_only_confidence: 0.7      # Reduce confidence if thermal unavailable
    thermal_only_confidence: 0.6     # Reduce confidence if visual unavailable
    single_modality_min: 0.4         # Minimum confidence for single modality

    # Sensor failure handling
    sensor_timeout_ms: 1000          # Timeout before fallback
    retry_attempts: 3                # Retry before fallback

    # Attention model fallback
    attention_fallback: "confidence_voting"
    fallback_trigger: "model_load_failure"

  ################################################################################
  # Expected Performance
  ################################################################################
  performance_targets:
    fusion_overhead_ms: 1.5          # Total fusion latency budget
    accuracy_improvement_pct: 10     # Expected mAP improvement
    false_positive_reduction_pct: 30 # FP reduction from multi-modal
    thermal_correlation_accuracy: 95 # Hot spot detection accuracy %

  ################################################################################
  # Logging & Monitoring
  ################################################################################
  logging:
    log_fused_detections: true
    log_thermal_correlations: true
    log_confidence_adjustments: true
    log_latency: true
    metrics_interval_frames: 100

