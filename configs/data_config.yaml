    name: "transformer"
    supercategory: "substation"
    description: "Power transformers (distribution, power)"
    thermal_zone: "transformer"
    priority: high

  - id: 1
    name: "insulator"
    supercategory: "substation"
    description: "Ceramic, composite, or glass insulators"
    thermal_zone: "insulator"
    priority: high

  - id: 2
    name: "conductor"
    supercategory: "substation"
    description: "Power lines, cables, bus bars"
    thermal_zone: "conductor"
    priority: high

  - id: 3
    name: "switchgear"
    supercategory: "substation"
    description: "Circuit breakers, switches, fuses"
    thermal_zone: "switchgear"
    priority: high

  - id: 4
    name: "circuit_breaker"
    supercategory: "substation"
    description: "Individual circuit breakers"
    thermal_zone: "switchgear"
    priority: medium

  - id: 5
    name: "disconnect_switch"
    supercategory: "substation"
    description: "Disconnect/isolation switches"
    thermal_zone: "switchgear"
    priority: medium

  - id: 6
    name: "capacitor_bank"
    supercategory: "substation"
    description: "Capacitor assemblies for power factor correction"
    thermal_zone: "general"
    priority: medium

  - id: 7
    name: "lightning_arrester"
    supercategory: "substation"
    description: "Surge arresters and lightning protection"
    thermal_zone: "insulator"
    priority: medium

  # Data Center/Cooling (8-15)
  - id: 8
    name: "server_rack"
    supercategory: "datacenter"
    description: "Server cabinets and racks"
    thermal_zone: "server"
    priority: high

  - id: 9
    name: "hvac_unit"
    supercategory: "datacenter"
    description: "HVAC systems and cooling units"
    thermal_zone: "hvac"
    priority: high

  - id: 10
    name: "cooling_fan"
    supercategory: "datacenter"
    description: "Cooling fans and ventilation"
    thermal_zone: "hvac"
    priority: medium

  - id: 11
    name: "electrical_panel"
    supercategory: "datacenter"
    description: "Electrical distribution panels"
    thermal_zone: "switchgear"
    priority: high

  - id: 12
    name: "cable"
    supercategory: "datacenter"
    description: "Data and power cables"
    thermal_zone: "conductor"
    priority: low

  - id: 13
    name: "ups"
    supercategory: "datacenter"
    description: "Uninterruptible power supply units"
    thermal_zone: "server"
    priority: medium

  - id: 14
    name: "pdu"
    supercategory: "datacenter"
    description: "Power distribution units"
    thermal_zone: "switchgear"
    priority: medium

  - id: 15
    name: "fire_suppression"
    supercategory: "datacenter"
    description: "Fire suppression systems and extinguishers"
    thermal_zone: "general"
    priority: low

  # General (16-18)
  - id: 16
    name: "vegetation"
    supercategory: "general"
    description: "Trees, bushes, vegetation encroachment"
    thermal_zone: "general"
    priority: medium

  - id: 17
    name: "person"
    supercategory: "general"
    description: "Personnel in inspection area"
    thermal_zone: "general"
    priority: low

  - id: 18
    name: "vehicle"
    supercategory: "general"
    description: "Service vehicles"
    thermal_zone: "general"
    priority: low

  # Hazards/Defects (19-25)
  - id: 19
    name: "damage"
    supercategory: "defect"
    description: "General physical damage"
    thermal_zone: "general"
