    thermal_zone: "general"
    priority: critical

  - id: 22
    name: "leak"
    supercategory: "defect"
    description: "Oil, water, or gas leaks"
    thermal_zone: "general"
    priority: critical

  - id: 23
    name: "crack"
    supercategory: "defect"
    description: "Structural cracks and fractures"
    thermal_zone: "general"
    priority: high

  - id: 24
    name: "contamination"
    supercategory: "defect"
    description: "Surface contamination, pollution buildup"
    thermal_zone: "general"
    priority: medium

  - id: 25
    name: "bird_nest"
    supercategory: "defect"
