# BAHB Data Pipeline Configuration
# Master class definitions and data pipeline settings
# Aligned with bahb/core/types.py:DetectionClass

# =============================================================================
# Detection Classes (30 classes, 0-indexed)
# =============================================================================
classes:
  # Substation Equipment (0-7)
