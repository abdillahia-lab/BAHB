<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180">
  <defs>
    <!-- Premium chrome gradient -->
    <linearGradient id="chromeMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="20%" stop-color="#d4d6d8"/>
      <stop offset="40%" stop-color="#8a8d90"/>
      <stop offset="60%" stop-color="#a8abae"/>
      <stop offset="80%" stop-color="#c8cacb"/>
      <stop offset="100%" stop-color="#e8eaeb"/>
    </linearGradient>

    <!-- Darker chrome for depth -->
    <linearGradient id="chromeDark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#606366"/>
      <stop offset="50%" stop-color="#484b4e"/>
      <stop offset="100%" stop-color="#707376"/>
    </linearGradient>

    <!-- Cyan core radial -->
    <radialGradient id="cyanCore" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#b8f4ff"/>
      <stop offset="40%" stop-color="#00d4ff"/>
      <stop offset="80%" stop-color="#0099cc"/>
      <stop offset="100%" stop-color="#006688"/>
    </radialGradient>

    <!-- Ambient cyan glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#00d4ff" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#00d4ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Core glow filter -->
    <filter id="coreGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Ring shadow -->
    <filter id="ringShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>

    <!-- Text shadow -->
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient glow background -->
  <ellipse cx="200" cy="60" rx="60" ry="60" fill="url(#ambientGlow)"/>

  <!-- Outer orbital ring - primary -->
  <ellipse cx="200" cy="60" rx="58" ry="22" fill="none" stroke="url(#chromeMain)" stroke-width="6"
           transform="rotate(-15, 200, 60)" filter="url(#ringShadow)"/>

  <!-- Middle orbital ring -->
  <ellipse cx="200" cy="60" rx="46" ry="17" fill="none" stroke="url(#chromeDark)" stroke-width="4"
           transform="rotate(10, 200, 60)"/>

  <!-- Inner orbital ring -->
  <ellipse cx="200" cy="60" rx="36" ry="13" fill="none" stroke="url(#chromeMain)" stroke-width="3"
           transform="rotate(-8, 200, 60)" opacity="0.8"/>

  <!-- Eye housing (elliptical) -->
  <ellipse cx="200" cy="60" rx="26" ry="20" fill="#0a0d12" stroke="url(#chromeMain)" stroke-width="3"/>

  <!-- Inner eye ring -->
  <ellipse cx="200" cy="60" rx="19" ry="14" fill="none" stroke="url(#chromeDark)" stroke-width="1.5"/>

  <!-- Cyan core with glow -->
  <circle cx="200" cy="60" r="14" fill="url(#cyanCore)" filter="url(#coreGlow)"/>

  <!-- Core inner bright -->
  <circle cx="200" cy="60" r="7" fill="#00d4ff"/>
  <circle cx="200" cy="60" r="3.5" fill="#ffffff" opacity="0.95"/>

  <!-- Specular highlights -->
  <ellipse cx="195" cy="54" rx="3" ry="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="206" cy="66" r="1.2" fill="#ffffff" opacity="0.5"/>

  <!-- JINKI text -->
  <text x="200" y="115" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif"
        font-size="26" font-weight="700" fill="url(#chromeMain)" letter-spacing="0.3em"
        filter="url(#textShadow)">JINKI</text>

  <!-- INTELLIGENCE text -->
  <text x="200" y="135" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif"
        font-size="10" font-weight="500" fill="#8b949e" letter-spacing="0.25em">INTELLIGENCE</text>

  <!-- Tagline -->
  <text x="200" y="158" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif"
        font-size="7" font-weight="400" fill="#6e7681" letter-spacing="0.3em" opacity="0.9">EX ALTO OMNIA</text>
</svg>
