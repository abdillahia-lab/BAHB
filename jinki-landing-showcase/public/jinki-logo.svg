<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180">
  <defs>
    <!-- Premium chrome gradient -->
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="20%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#b8b8b8"/>
      <stop offset="60%" stop-color="#e0e0e0"/>
      <stop offset="80%" stop-color="#a8a8a8"/>
      <stop offset="100%" stop-color="#d0d0d0"/>
    </linearGradient>

    <!-- Dark chrome for depth -->
    <linearGradient id="chromeDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#707070"/>
      <stop offset="50%" stop-color="#909090"/>
      <stop offset="100%" stop-color="#606060"/>
    </linearGradient>

    <!-- Cyan core gradient -->
    <radialGradient id="cyanCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="30%" stop-color="#00e5ff"/>
      <stop offset="60%" stop-color="#00bcd4"/>
      <stop offset="100%" stop-color="#0097a7"/>
    </radialGradient>

    <!-- Intense cyan glow -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#00d4ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong glow for core -->
    <filter id="coreGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ambient glow behind eye -->
  <ellipse cx="200" cy="65" rx="50" ry="50" fill="url(#cyanGlow)" opacity="0.5"/>

  <!-- Outer orbital ring 1 -->
  <ellipse cx="200" cy="65" rx="58" ry="22" fill="none" stroke="url(#chrome)" stroke-width="3"
           transform="rotate(-8, 200, 65)" filter="url(#shadow)"/>

  <!-- Outer orbital ring 2 -->
  <ellipse cx="200" cy="65" rx="52" ry="19" fill="none" stroke="url(#chromeDark)" stroke-width="2"
           transform="rotate(5, 200, 65)"/>

  <!-- Middle orbital ring -->
  <ellipse cx="200" cy="65" rx="42" ry="15" fill="none" stroke="url(#chrome)" stroke-width="2.5"
           transform="rotate(-3, 200, 65)"/>

  <!-- Inner orbital ring -->
  <ellipse cx="200" cy="65" rx="32" ry="11" fill="none" stroke="url(#chromeDark)" stroke-width="1.5"
           transform="rotate(2, 200, 65)"/>

  <!-- Eye outer ring -->
  <circle cx="200" cy="65" r="22" fill="none" stroke="url(#chrome)" stroke-width="3" filter="url(#glow)"/>

  <!-- Eye inner ring -->
  <circle cx="200" cy="65" r="18" fill="none" stroke="url(#chromeDark)" stroke-width="1.5"/>

  <!-- Cyan glowing core -->
  <circle cx="200" cy="65" r="14" fill="url(#cyanCore)" filter="url(#coreGlow)"/>

  <!-- Core depth ring -->
  <circle cx="200" cy="65" r="14" fill="none" stroke="#00ffff" stroke-width="0.5" opacity="0.6"/>

  <!-- Pupil -->
  <circle cx="200" cy="65" r="5" fill="#0a1929"/>

  <!-- Highlight -->
  <circle cx="195" cy="60" r="2.5" fill="rgba(255,255,255,0.8)"/>
  <circle cx="206" cy="68" r="1" fill="rgba(255,255,255,0.4)"/>

  <!-- Aperture blade hints -->
  <g opacity="0.3" stroke="#0a1929" stroke-width="0.8" fill="none">
    <line x1="200" y1="51" x2="193" y2="58"/>
    <line x1="200" y1="51" x2="207" y2="58"/>
    <line x1="214" y1="65" x2="207" y2="60"/>
    <line x1="214" y1="65" x2="207" y2="70"/>
    <line x1="200" y1="79" x2="193" y2="72"/>
    <line x1="200" y1="79" x2="207" y2="72"/>
    <line x1="186" y1="65" x2="193" y2="60"/>
    <line x1="186" y1="65" x2="193" y2="70"/>
  </g>

  <!-- Company name -->
  <text x="200" y="120" text-anchor="middle"
        font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="22" font-weight="600" fill="#f0f6fc" letter-spacing="0.35em">JINKI</text>

  <text x="200" y="142" text-anchor="middle"
        font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="10" font-weight="400" fill="#6e7681" letter-spacing="0.25em">INTELLIGENCE</text>

  <!-- Tagline -->
  <text x="200" y="165" text-anchor="middle"
        font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="8" font-weight="300" fill="#484f58" letter-spacing="0.3em">EX ALTO OMNIA</text>
</svg>