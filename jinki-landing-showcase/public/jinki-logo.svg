<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <!-- Chrome gradient - premium metallic -->
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="25%" stop-color="#c0c0c0"/>
      <stop offset="50%" stop-color="#808080"/>
      <stop offset="75%" stop-color="#b0b0b0"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>

    <!-- Darker chrome for contrast -->
    <linearGradient id="chromeDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#505050"/>
      <stop offset="50%" stop-color="#707070"/>
      <stop offset="100%" stop-color="#404040"/>
    </linearGradient>

    <!-- Cyan core - bright and glowing -->
    <radialGradient id="cyanCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#80ffff"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0088aa"/>
    </radialGradient>

    <!-- Cyan ambient glow -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#00d4ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow filters -->
    <filter id="coreGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient glow -->
  <ellipse cx="200" cy="70" rx="70" ry="70" fill="url(#cyanGlow)"/>

  <!-- Outer orbital ring - thick -->
  <ellipse cx="200" cy="70" rx="75" ry="28" fill="none" stroke="url(#chrome)" stroke-width="8"
           transform="rotate(-12, 200, 70)" filter="url(#ringGlow)"/>

  <!-- Middle orbital ring -->
  <ellipse cx="200" cy="70" rx="60" ry="22" fill="none" stroke="url(#chromeDark)" stroke-width="5"
           transform="rotate(8, 200, 70)"/>

  <!-- Inner orbital ring -->
  <ellipse cx="200" cy="70" rx="48" ry="17" fill="none" stroke="url(#chrome)" stroke-width="4"
           transform="rotate(-5, 200, 70)"/>

  <!-- Eye housing -->
  <ellipse cx="200" cy="70" rx="32" ry="24" fill="#0d1117" stroke="url(#chrome)" stroke-width="4"/>

  <!-- Inner eye ring -->
  <ellipse cx="200" cy="70" rx="24" ry="18" fill="none" stroke="url(#chromeDark)" stroke-width="2"/>

  <!-- Cyan core with glow -->
  <circle cx="200" cy="70" r="18" fill="url(#cyanCore)" filter="url(#coreGlow)"/>

  <!-- Core bright center -->
  <circle cx="200" cy="70" r="8" fill="#00d4ff"/>
  <circle cx="200" cy="70" r="4" fill="#ffffff" opacity="0.9"/>

  <!-- Highlight reflections -->
  <circle cx="193" cy="63" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="208" cy="76" r="1.5" fill="#ffffff" opacity="0.4"/>

  <!-- JINKI text -->
  <text x="200" y="130" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="28" font-weight="700" fill="url(#chrome)" letter-spacing="0.25em">JINKI</text>

  <!-- INTELLIGENCE text -->
  <text x="200" y="152" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="12" font-weight="500" fill="#8b949e" letter-spacing="0.2em">INTELLIGENCE</text>

  <!-- Tagline -->
  <text x="200" y="175" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="9" font-weight="400" fill="#6e7681" letter-spacing="0.25em">EX ALTO OMNIA</text>
</svg>