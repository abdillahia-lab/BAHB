# Mosquitto MQTT Broker Configuration for BAHB
# Production-ready configuration with security considerations

# ==========================================
# Persistence
# ==========================================
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

# ==========================================
# Logging
# ==========================================
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ==========================================
# Network - MQTT Protocol
# ==========================================
listener 1883
protocol mqtt
max_connections -1

# ==========================================
# Network - WebSockets
# ==========================================
listener 9001
protocol websockets

# ==========================================
# Security
# ==========================================
# WARNING: For production, set allow_anonymous to false
# and configure password_file
allow_anonymous true

# For production, uncomment and configure:
# allow_anonymous false
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl

# ==========================================
# Connection Settings
# ==========================================
max_keepalive 65535
max_packet_size 0
message_size_limit 0

# ==========================================
# Memory
# ==========================================
max_inflight_messages 20
max_queued_messages 1000
max_queued_bytes 0

# ==========================================
# Persistence Settings
# ==========================================
persistence_file mosquitto.db
retained_persistence true

# ==========================================
# Bridge (for cloud MQTT if needed)
# ==========================================
# Uncomment to enable bridge to cloud MQTT broker
# connection bridge-to-cloud
# address cloud-mqtt-broker.com:8883
# bridge_cafile /mosquitto/certs/ca.crt
# bridge_certfile /mosquitto/certs/client.crt
# bridge_keyfile /mosquitto/certs/client.key
# topic bahb/# out 2
# topic bahb/commands/# in 2
