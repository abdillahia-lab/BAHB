# TensorRT Optimization Configuration for BAHB
# Comprehensive settings for converting and optimizing models

# Global TensorRT Settings
global:
  workspace_size: 4294967296  # 4GB in bytes
  max_batch_size: 1
  device_id: 0
  dla_core: -1  # -1 = disabled, 0/1 = use DLA core (Orin only)
  strict_types: false  # Allow layer fusion across precision boundaries

  # Precision settings
  fp16_mode: true
  int8_mode: false  # Set to true when calibration data available
  tf32_mode: true   # Use TF32 for Ampere+ GPUs

  # Optimization flags
  builder_optimization_level: 5  # 0-5, higher = more optimization
  min_timing_iterations: 2
  avg_timing_iterations: 4

  # Profiling
  profiling_verbosity: "detailed"  # layer_names_only, detailed, none
  enable_profiling: true

# YOLOv12 Detection Model
yolov12:
  model_name: "yolov12_detection"

  # Input configuration
  input:
    name: "images"
    shape: [1, 3, 720, 1280]  # NCHW format
    dtype: "float32"
    format: "nchw"

  # Output configuration
  output:
    - name: "output0"
      shape: [1, 300, 6]  # [batch, num_detections, xyxy+conf+class]
      dtype: "float32"

  # ONNX export settings
  onnx:
    opset_version: 13
    simplify: true
    dynamic_batch: false
    dynamic_axes: {}
    export_path: "optimization/models/yolov12.onnx"

  # TensorRT engine settings
  engine:
    precision: "int8"  # fp32, fp16, int8
    workspace_size: 4294967296  # 4GB
    output_path: "optimization/models/yolov12_int8.engine"

    # INT8 calibration
    calibration:
      enabled: true
      algorithm: "entropy_v2"  # entropy_v2, minmax, entropy
      num_images: 500
      batch_size: 8
      cache_file: "optimization/calibration/yolov12_calibration.cache"
      image_dir: "data/processed/val/images"

    # Layer-specific optimizations
    layer_optimizations:
      # Allow FP16 fallback for sensitive layers
      precision_constraints:
        - layer_pattern: "head.*"
          precision: "fp16"  # Detection head in FP16 for accuracy

      # Fusion patterns
      fusions:
        - conv_bias_relu
        - conv_bias_add_relu
        - conv_elementwise

    # Plugins
    plugins:
      nms:
        enabled: false  # YOLOv12 is NMS-free (YOLOv10 architecture)
        score_threshold: 0.35
        iou_threshold: 0.45
        max_output_boxes: 300

      batch_norm_fusion: true

    # Memory optimization
    memory:
      refit: false  # Allow weight refitting
      sparse_weights: false  # Sparsity support
      builder_memory_pool_limit: 8589934592  # 8GB for builder

  # Validation
  validation:
    enabled: true
    tolerance: 0.02  # 2% max accuracy degradation
    num_test_images: 100
    metrics:
      - "mAP50"
      - "mAP50-95"
      - "precision"
      - "recall"

# RF-DETR Segmentation Model
rf_detr:
  model_name: "rf_detr_segmentation"

  input:
    name: "images"
    shape: [1, 3, 640, 640]
    dtype: "float32"
    format: "nchw"

  output:
    - name: "boxes"
      shape: [1, 300, 4]
    - name: "scores"
      shape: [1, 300, 1]
    - name: "masks"
      shape: [1, 300, 160, 160]

  onnx:
    opset_version: 13
    simplify: true
    export_path: "optimization/models/rf_detr.onnx"

  engine:
    precision: "int8"
    workspace_size: 4294967296
    output_path: "optimization/models/rf_detr_int8.engine"

    calibration:
      enabled: true
      algorithm: "entropy_v2"
      num_images: 500
      batch_size: 8
      cache_file: "optimization/calibration/rf_detr_calibration.cache"
      image_dir: "data/processed/val/images"

    layer_optimizations:
      precision_constraints:
        - layer_pattern: "transformer.*"
          precision: "fp16"  # Transformer layers more sensitive
        - layer_pattern: "mask_head.*"
          precision: "fp16"  # Mask generation in FP16

    plugins:
      roi_align: true

  validation:
    enabled: true
    tolerance: 0.03
    num_test_images: 100

# SAM3 Nano Segmentation Model
sam3_nano:
  model_name: "sam3_nano_segmenter"

  # Image encoder
  encoder:
    input:
      name: "images"
      shape: [1, 3, 1024, 1024]
      dtype: "float32"

    output:
      name: "image_embeddings"
      shape: [1, 256, 64, 64]

    engine:
      precision: "fp16"  # SAM sensitive to quantization
      workspace_size: 2147483648  # 2GB
      output_path: "optimization/models/sam3_encoder_fp16.engine"

  # Mask decoder
  decoder:
    input:
      - name: "image_embeddings"
        shape: [1, 256, 64, 64]
      - name: "point_coords"
        shape: [1, 2, 2]  # xy coordinates
      - name: "point_labels"
        shape: [1, 2]     # 0/1 labels

    output:
      - name: "masks"
        shape: [1, 1, 256, 256]
      - name: "iou_predictions"
        shape: [1, 1]

    engine:
      precision: "fp16"
      workspace_size: 1073741824  # 1GB
      output_path: "optimization/models/sam3_decoder_fp16.engine"

  validation:
    enabled: true
    tolerance: 0.01  # Very strict for segmentation
    num_test_images: 50

# Qwen2.5-VL Vision-Language Model
qwen_vl:
  model_name: "qwen_vl_analyzer"

  # Note: VLM uses AWQ INT4 quantization, not TensorRT
  # Included here for completeness

  awq:
    enabled: true
    w_bit: 4  # INT4 weights
    q_group_size: 128
    zero_point: true
    version: "GEMM"

    calibration:
      num_samples: 128
      seq_length: 512

    output_path: "optimization/models/Qwen2.5-VL-3B-AWQ"

  # Fallback TensorRT for vision encoder only
  vision_encoder:
    engine:
      precision: "int8"
      workspace_size: 2147483648
      output_path: "optimization/models/qwen_vision_int8.engine"

# Hardware-Specific Profiles
hardware_profiles:

  # NVIDIA Jetson Orin NX
  orin_nx:
    device_type: "jetson"
    compute_capability: "8.7"

    # DLA (Deep Learning Accelerator) settings
    dla:
      enabled: true
      fallback_to_gpu: true
      dla_cores: [0, 1]

    # Power mode
    power_mode: "MAXN"  # 15W, 25W, MAXN
    nvpmodel: 0  # 0 = MAXN, 1 = 25W, 2 = 15W

    # Clocks
    clocks:
      gpu_max_freq: 1300  # MHz
      emc_max_freq: 3200  # Memory MHz

    # Memory
    memory:
      total_vram: 16384  # MB
      ai_allocation: 12288  # MB (75%)

    # Optimization flags
    builder_flags:
      - "FP16"
      - "INT8"
      - "STRICT_TYPES"
      - "PREFER_PRECISION_CONSTRAINTS"

  # Qualcomm QCS6490 (DJI RC Plus 2)
  qcs6490:
    device_type: "qualcomm"
    gpu: "adreno_643"

    # Qualcomm-specific (if using Qualcomm Neural Processing SDK)
    snpe:
      enabled: true
      runtime: "GPU_FP16"  # GPU, GPU_FP16, DSP
      performance_profile: "high_performance"

    # OpenCL fallback
    opencl:
      enabled: true
      platform: "Adreno"
      precision: "fp16"

    memory:
      total: 8192  # MB
      ai_allocation: 4096  # MB

# Build Pipeline
build_pipeline:

  # Export to ONNX
  export_onnx:
    enabled: true
    optimize: true
    check_model: true

  # Build TensorRT engine
  build_engine:
    enabled: true
    timing_cache: "optimization/timing_cache"
    verbose: true

  # Validate engine
  validate:
    enabled: true
    compare_outputs: true
    tolerance:
      abs: 0.01
      rel: 0.02

  # Benchmark
  benchmark:
    enabled: true
    iterations: 1000
    warmup: 10

  # Deploy
  deploy:
    enabled: false
    destinations:
      - path: "/opt/bahb/models/"
        backup: true

# Performance Targets
performance_targets:
  yolov12:
    latency_p50_ms: 6.0
    latency_p95_ms: 8.0
    throughput_fps: 120
    memory_mb: 1500
    accuracy_min_map50: 97.5

  rf_detr:
    latency_p50_ms: 18.0
    latency_p95_ms: 25.0
    throughput_fps: 40
    memory_mb: 1200

  sam3_nano:
    latency_p50_ms: 15.0
    latency_p95_ms: 20.0
    memory_mb: 600

  full_pipeline:
    latency_p50_ms: 150.0
    latency_p95_ms: 200.0
    throughput_fps: 30
    total_memory_mb: 5200
    power_watts: 16.0

# Logging and Monitoring
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  save_logs: true
  log_dir: "optimization/logs"

  tensorrt_logger:
    severity: "WARNING"  # INTERNAL_ERROR, ERROR, WARNING, INFO, VERBOSE

  builder_log: true
  timing_log: true
  layer_info: true

# Advanced Options
advanced:

  # CUDA graphs for reduced launch overhead
  cuda_graphs:
    enabled: true
    capture_mode: "relaxed"  # global, thread_local, relaxed

  # Multi-stream inference
  streams:
    enabled: true
    num_streams: 4
    stream_priority: "default"  # default, high

  # Kernel auto-tuning
  autotuning:
    enabled: true
    timing_cache_size: 1073741824  # 1GB
    save_timing_cache: true

  # Tactic selection
  tactics:
    algorithm_selector: "auto"  # auto, manual
    min_workspace_size: 1073741824  # 1GB

  # Version compatibility
  version_compatibility:
    enabled: false  # Cross-version engine compatibility

  # Hardware compatibility
  hardware_compatibility:
    enabled: false  # Cross-hardware engine compatibility (slight perf loss)
